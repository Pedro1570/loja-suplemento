<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Painel Administrativo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topo">
      <h1>Pedidos</h1>
    </div>

    <div class="barra-acoes-admin">
      <div class="filtros-inline">
        <select class="input-admin" id="filtro-status-pedido">
          <option value="">Todos os status</option>
          <option value="aguardando_pagamento">Aguardando pagamento</option>
          <option value="pagamento_aprovado">Pagamento aprovado</option>
          <option value="em_preparacao">Em preparação</option>
          <option value="pronto_retirada">Pronto para retirada</option>
          <option value="enviado">Enviado</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <button class="btn btn-secundario btn-sm" id="btn-ver-retirada">📦 Aguardando retirada</button>
      </div>
    </div>

    <div class="painel">
      <table class="tabela-admin">
        <thead><tr><th>Pedido</th><th>Cliente</th><th>Data</th><th>Valor</th><th>Pagamento</th><th>Recebimento</th><th>Status</th><th></th></tr></thead>
        <tbody id="tabela-pedidos-admin"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-pedido">
  <div class="modal-box" id="conteudo-modal-pedido"></div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/admin-common.js"></script>
<script src="../../js/admin-pedidos.js"></script>
</body>
</html>
