<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Painel Administrativo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topo">
      <h1>Dashboard</h1>
    </div>

    <div class="grid-cards-metricas">
      <div class="card-metrica"><span class="label">Vendas hoje</span><strong id="m-vendas-hoje">—</strong><span class="variacao" id="m-pedidos-hoje"></span></div>
      <div class="card-metrica"><span class="label">Vendas no mês</span><strong id="m-vendas-mes">—</strong><span class="variacao" id="m-pedidos-mes"></span></div>
      <div class="card-metrica"><span class="label">Pedidos pendentes</span><strong id="m-pendentes">—</strong></div>
      <div class="card-metrica"><span class="label">Pedidos concluídos</span><strong id="m-concluidos">—</strong></div>
    </div>

    <div class="grid-cards-metricas" style="grid-template-columns:repeat(2,1fr)">
      <div class="card-metrica"><span class="label">Produtos cadastrados</span><strong id="m-produtos">—</strong></div>
      <div class="card-metrica"><span class="label">Clientes cadastrados</span><strong id="m-clientes">—</strong></div>
    </div>

    <div class="grid-admin-2">
      <div class="painel">
        <h3>Vendas nos últimos 14 dias</h3>
        <div id="grafico-vendas"></div>
      </div>
      <div class="painel">
        <h3>Pedidos por status</h3>
        <div id="grafico-status"></div>
      </div>
    </div>

    <div class="grid-admin-2">
      <div class="painel">
        <h3>Produtos mais vendidos</h3>
        <table class="tabela-admin">
          <thead><tr><th>Produto</th><th>Vendidos</th></tr></thead>
          <tbody id="tabela-mais-vendidos"></tbody>
        </table>
      </div>
      <div class="painel">
        <h3>⚠️ Estoque baixo</h3>
        <table class="tabela-admin">
          <thead><tr><th>Produto</th><th>Estoque</th></tr></thead>
          <tbody id="tabela-estoque-baixo"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/admin-common.js"></script>
<script src="../../js/admin-dashboard.js"></script>
</body>
</html>
